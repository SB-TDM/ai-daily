[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-daily"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pytest",
    "httpx",
    "playwright",
    "tzdata",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
